<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="netlify-cms-backend-site-id" content="website-makmurjaya-2026.netlify.app" />
  <title>Admin CMS — Website Desa Makmurjaya</title>
  <style>
    /* Loading state */
    body { font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <script>
    // Prevent auto-init — we need to set site_id manually
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.init({
      config: {
        backend: {
          name: 'github',
          repo: 'makmurjaya-2026/website-desa-makmurjaya',
          branch: 'main',
          base_url: 'https://api.netlify.com',
          auth_endpoint: 'auth',
          site_id: 'website-makmurjaya-2026.netlify.app'
        },
        media_folder: 'public/uploads',
        public_folder: '/website-desa-makmurjaya/uploads',
        locale: 'id',
        collections: [
          {
            name: 'berita',
            label: 'Berita',
            label_singular: 'Artikel Berita',
            folder: 'src/content/berita',
            create: true,
            delete: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Judul', name: 'judul', widget: 'string', required: true },
              { label: 'Slug URL', name: 'slug', widget: 'string', required: true, hint: 'Contoh: peluncuran-website-desa (huruf kecil, tanda hubung)' },
              { label: 'Tanggal Publikasi', name: 'tanggal', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false },
              { label: 'Foto Thumbnail', name: 'foto_thumbnail', widget: 'image', required: false, hint: 'Maks 5MB. Format: JPG, PNG, WebP' },
              { label: 'Cuplikan', name: 'cuplikan', widget: 'text', required: false, hint: 'Ringkasan singkat artikel (maks 300 karakter)' },
              { label: 'Penulis', name: 'penulis', widget: 'string', required: false },
              { label: 'Isi Berita', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'pengumuman',
            label: 'Pengumuman',
            folder: 'src/content/pengumuman',
            create: true,
            delete: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Judul', name: 'judul', widget: 'string' },
              { label: 'Slug URL', name: 'slug', widget: 'string' },
              { label: 'Kategori', name: 'kategori', widget: 'select', options: ['Pengumuman', 'Agenda'] },
              { label: 'Tanggal Publikasi', name: 'tanggal', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false },
              { label: 'Tanggal Pelaksanaan (khusus Agenda)', name: 'tanggal_pelaksanaan', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false, required: false },
              { label: 'Waktu Pelaksanaan', name: 'waktu_pelaksanaan', widget: 'string', required: false, hint: 'Contoh: 09.00 WIB' },
              { label: 'Cuplikan', name: 'cuplikan', widget: 'text', required: false },
              { label: 'Lampiran', name: 'lampiran', widget: 'list', required: false, fields: [
                { label: 'Nama File', name: 'nama_file', widget: 'string' },
                { label: 'File', name: 'url', widget: 'file' },
                { label: 'Ukuran (KB)', name: 'ukuran_kb', widget: 'number', required: false }
              ]},
              { label: 'Isi Pengumuman', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'wisata',
            label: 'Destinasi Wisata',
            folder: 'src/content/wisata',
            create: true,
            delete: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Nama Destinasi', name: 'nama', widget: 'string' },
              { label: 'Slug URL', name: 'slug', widget: 'string' },
              { label: 'Foto Utama', name: 'foto_utama', widget: 'image', required: false, hint: 'Maks 5MB. Format: JPG, PNG, WebP' },
              { label: 'Deskripsi Singkat', name: 'deskripsi_singkat', widget: 'text' },
              { label: 'Jam Operasional', name: 'jam_operasional', widget: 'string', required: false, hint: 'Contoh: Senin-Minggu, 07.00-17.00 WIB' },
              { label: 'Harga Tiket', name: 'harga_tiket', widget: 'string', required: false, hint: 'Contoh: Rp 10.000/orang, atau Gratis' },
              { label: 'Kontak Narahubung', name: 'kontak', widget: 'string', required: false },
              { label: 'Petunjuk Akses', name: 'petunjuk_akses', widget: 'text', required: false },
              { label: 'Latitude Peta', name: 'lokasi_lat', widget: 'number', required: false, value_type: 'float' },
              { label: 'Longitude Peta', name: 'lokasi_lng', widget: 'number', required: false, value_type: 'float' },
              { label: 'Label Peta', name: 'lokasi_label', widget: 'string', required: false },
              { label: 'Galeri Foto', name: 'galeri_foto', widget: 'list', field: { label: 'Foto', name: 'foto', widget: 'image' }, required: false },
              { label: 'Deskripsi Lengkap', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'umkm',
            label: 'UMKM',
            folder: 'src/content/umkm',
            create: true,
            delete: true,
            slug: '{{slug}}',
            fields: [
              { label: 'Nama Usaha', name: 'nama_usaha', widget: 'string' },
              { label: 'Slug URL', name: 'slug', widget: 'string' },
              { label: 'Pemilik', name: 'pemilik', widget: 'string' },
              { label: 'Kategori', name: 'kategori', widget: 'string', required: false, hint: 'Contoh: Kerajinan, Kuliner, Pertanian, Jasa' },
              { label: 'Jenis Produk', name: 'jenis_produk', widget: 'string' },
              { label: 'Range Harga', name: 'harga_range', widget: 'string', required: false, hint: 'Contoh: Rp 15.000 - Rp 50.000' },
              { label: 'Nomor WhatsApp', name: 'kontak_wa', widget: 'string', hint: 'Format: 628XXXXXXXXX (tanpa spasi, tanda plus, atau tanda hubung)' },
              { label: 'Alamat', name: 'alamat', widget: 'string', required: false },
              { label: 'Latitude Lokasi', name: 'lokasi_lat', widget: 'number', required: false, value_type: 'float', hint: 'Koordinat latitude dari Google Maps (contoh: -6.122)' },
              { label: 'Longitude Lokasi', name: 'lokasi_lng', widget: 'number', required: false, value_type: 'float', hint: 'Koordinat longitude dari Google Maps (contoh: 107.325)' },
              { label: 'Link Google Maps', name: 'lokasi_gmaps', widget: 'string', required: false, hint: 'Link Google Maps ke lokasi usaha' },
              { label: 'Foto Utama', name: 'foto_utama', widget: 'image', required: false, hint: 'Maks 5MB. Format: JPG, PNG, WebP' },
              { label: 'Galeri Produk', name: 'galeri_foto', widget: 'list', field: { label: 'Foto', name: 'foto', widget: 'image' }, required: false },
              { label: 'Deskripsi Usaha', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'galeri',
            label: 'Galeri Foto',
            folder: 'src/content/galeri',
            create: true,
            delete: true,
            slug: '{{judul_foto}}',
            extension: 'json',
            format: 'json',
            fields: [
              { label: 'Judul Foto', name: 'judul_foto', widget: 'string' },
              { label: 'File Foto', name: 'file_foto', widget: 'image', hint: 'Maks 5MB. Format: JPG, PNG, WebP' },
              { label: 'Caption', name: 'caption', widget: 'text', required: false },
              { label: 'Album/Kategori', name: 'album', widget: 'string', default: 'Umum' },
              { label: 'Tanggal Upload', name: 'tanggal_upload', widget: 'datetime', date_format: 'YYYY-MM-DD', time_format: false },
              { label: 'Urutan', name: 'urutan', widget: 'number', default: 0 }
            ]
          },
          {
            name: 'perangkat-desa',
            label: 'Perangkat Desa',
            folder: 'src/content/perangkat-desa',
            create: false,
            delete: false,
            slug: '{{slug}}',
            fields: [
              { label: 'Nama', name: 'nama', widget: 'string' },
              { label: 'Jabatan', name: 'jabatan', widget: 'string', hint: 'Jangan ubah jabatan — struktur organisasi sudah ditetapkan' },
              { label: 'Foto', name: 'foto', widget: 'image', required: false, hint: 'Maks 5MB. Format: JPG, PNG, WebP' },
              { label: 'Kontak', name: 'kontak', widget: 'string', required: false },
              { label: 'Urutan Tampil', name: 'urutan', widget: 'hidden' },
              { label: 'Level Hierarki', name: 'level_hierarki', widget: 'hidden' },
              { label: 'Atasan', name: 'parent_slug', widget: 'hidden' },
              { label: 'Tugas Pokok', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'faq',
            label: 'FAQ (Tanya Jawab)',
            folder: 'src/content/faq',
            create: true,
            delete: true,
            slug: '{{pertanyaan}}',
            fields: [
              { label: 'Pertanyaan', name: 'pertanyaan', widget: 'string' },
              { label: 'Kategori', name: 'kategori', widget: 'string', required: false },
              { label: 'Urutan', name: 'urutan', widget: 'number', default: 99 },
              { label: 'Jawaban', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'halaman-statis',
            label: 'Halaman Statis',
            folder: 'src/content/halaman-statis',
            create: false,
            delete: false,
            fields: [
              { label: 'Judul', name: 'judul', widget: 'string' },
              { label: 'Tipe Halaman', name: 'tipe', widget: 'select', options: ['profil-sejarah', 'profil-visi-misi', 'profil-lokasi', 'kontak-info'] },
              { label: 'Latitude (untuk peta)', name: 'lokasi_lat', widget: 'number', required: false, value_type: 'float' },
              { label: 'Longitude (untuk peta)', name: 'lokasi_lng', widget: 'number', required: false, value_type: 'float' },
              { label: 'Label Peta', name: 'lokasi_label', widget: 'string', required: false },
              { label: 'Konten', name: 'body', widget: 'markdown' }
            ]
          },
          {
            name: 'pengaturan-situs',
            label: 'Pengaturan Situs',
            files: [
              {
                name: 'situs',
                label: 'Informasi Umum Desa',
                file: 'src/data/situs.json',
                fields: [
                  { label: 'Nama Desa', name: 'nama_desa', widget: 'string' },
                  { label: 'Lokasi Singkat', name: 'lokasi_singkat', widget: 'string', hint: 'Contoh: Kec. Jayakerta, Kab. Karawang, Jawa Barat' },
                  { label: 'Tagline Hero (Homepage)', name: 'tagline_hero', widget: 'text' },
                  { label: 'Gambar Hero', name: 'hero_image', widget: 'image', required: false, hint: 'Foto utama yang tampil di homepage' },
                  { label: 'Deskripsi Footer', name: 'deskripsi_footer', widget: 'text' },
                  { label: 'Alamat Lengkap', name: 'alamat', widget: 'text' },
                  { label: 'Nomor Telepon', name: 'telepon', widget: 'string', required: false },
                  { label: 'Email', name: 'email', widget: 'string', required: false },
                  { label: 'Jam Layanan', name: 'jam_layanan', widget: 'string' },
                  { label: 'Latitude Peta', name: 'koordinat_lat', widget: 'number', value_type: 'float' },
                  { label: 'Longitude Peta', name: 'koordinat_lng', widget: 'number', value_type: 'float' },
                  { label: 'Sambutan Kepala Desa', name: 'sambutan_kades', widget: 'text', required: false },
                  { label: 'Nama Kepala Desa', name: 'nama_kades', widget: 'string' },
                  { label: 'Foto Kepala Desa', name: 'foto_kades', widget: 'image', required: false },
                  { label: 'Teks Copyright', name: 'copyright', widget: 'string' }
                ]
              }
            ]
          },
          {
            name: 'infografis',
            label: 'Infografis',
            files: [
              {
                name: 'penduduk',
                label: 'Data Penduduk',
                file: 'src/content/infografis/penduduk.json',
                fields: [
                  { label: 'Total Penduduk', name: 'total_penduduk', widget: 'number' },
                  { label: 'Kepala Keluarga', name: 'jumlah_kk', widget: 'number' },
                  { label: 'Laki-Laki', name: 'laki_laki', widget: 'number' },
                  { label: 'Perempuan', name: 'perempuan', widget: 'number' },
                  { label: 'Kelompok Umur', name: 'kelompok_umur', widget: 'list', fields: [
                    { label: 'Rentang', name: 'rentang', widget: 'string' },
                    { label: 'Jumlah', name: 'jumlah', widget: 'number' }
                  ]},
                  { label: 'Per Dusun', name: 'per_dusun', widget: 'list', fields: [
                    { label: 'Nama Dusun', name: 'nama', widget: 'string' },
                    { label: 'Jumlah', name: 'jumlah', widget: 'number' }
                  ]},
                  { label: 'Per Pendidikan', name: 'per_pendidikan', widget: 'list', fields: [
                    { label: 'Tingkat', name: 'tingkat', widget: 'string' },
                    { label: 'Jumlah', name: 'jumlah', widget: 'number' }
                  ]},
                  { label: 'Per Pekerjaan', name: 'per_pekerjaan', widget: 'list', fields: [
                    { label: 'Jenis', name: 'jenis', widget: 'string' },
                    { label: 'Jumlah', name: 'jumlah', widget: 'number' }
                  ]},
                  { label: 'Per Agama', name: 'per_agama', widget: 'list', fields: [
                    { label: 'Agama', name: 'agama', widget: 'string' },
                    { label: 'Jumlah', name: 'jumlah', widget: 'number' }
                  ]}
                ]
              },
              {
                name: 'idm',
                label: 'Data IDM',
                file: 'src/content/infografis/idm.json',
                fields: [
                  { label: 'Skor IDM', name: 'skor_idm', widget: 'number', value_type: 'float' },
                  { label: 'Status IDM', name: 'status_idm', widget: 'string', hint: 'Contoh: Berkembang, Maju, Mandiri' },
                  { label: 'Target Status', name: 'target_status', widget: 'string' },
                  { label: 'Skor Minimal', name: 'skor_minimal', widget: 'number', value_type: 'float' },
                  { label: 'Penambahan Dibutuhkan', name: 'penambahan', widget: 'number', value_type: 'float' },
                  { label: 'IKS (Sosial)', name: 'iks', widget: 'number', value_type: 'float' },
                  { label: 'IKE (Ekonomi)', name: 'ike', widget: 'number', value_type: 'float' },
                  { label: 'IKL (Lingkungan)', name: 'ikl', widget: 'number', value_type: 'float' },
                  { label: 'Skor Per Tahun', name: 'skor_per_tahun', widget: 'list', fields: [
                    { label: 'Tahun', name: 'tahun', widget: 'number' },
                    { label: 'Skor', name: 'skor', widget: 'number', value_type: 'float' }
                  ]},
                  { label: 'Tabel Indikator', name: 'tabel_indikator', widget: 'list', fields: [
                    { label: 'No', name: 'no', widget: 'number' },
                    { label: 'Dimensi', name: 'dimensi', widget: 'select', options: ['IKS', 'IKE', 'IKL'] },
                    { label: 'Indikator', name: 'indikator', widget: 'string' },
                    { label: 'Skor', name: 'skor', widget: 'number', value_type: 'float' },
                    { label: 'Keterangan', name: 'keterangan', widget: 'string', required: false },
                    { label: 'Kegiatan yang Dapat Dilakukan', name: 'kegiatan', widget: 'string', required: false },
                    { label: 'Nilai+', name: 'nilai_plus', widget: 'number', value_type: 'float', required: false },
                    { label: 'Pelaksana', name: 'pelaksana', widget: 'string', required: false, hint: 'Contoh: Pusat, Provinsi, Kab., Desa, CSR' }
                  ]}
                ]
              },
              {
                name: 'apbdes',
                label: 'Data APBDes',
                file: 'src/content/infografis/apbdes.json',
                fields: [
                  { label: 'Tahun Anggaran', name: 'tahun_anggaran', widget: 'number' },
                  { label: 'Pendapatan (Rp)', name: 'pendapatan', widget: 'number' },
                  { label: 'Belanja (Rp)', name: 'belanja', widget: 'number' },
                  { label: 'Penerimaan Pembiayaan (Rp)', name: 'penerimaan_pembiayaan', widget: 'number' },
                  { label: 'Pengeluaran Pembiayaan (Rp)', name: 'pengeluaran_pembiayaan', widget: 'number' },
                  { label: 'Surplus/Defisit (Rp)', name: 'surplus_defisit', widget: 'number' },
                  { label: 'Rincian Pendapatan', name: 'rincian_pendapatan', widget: 'list', fields: [
                    { label: 'Sumber', name: 'sumber', widget: 'string' },
                    { label: 'Nominal (Rp)', name: 'nominal', widget: 'number' }
                  ]},
                  { label: 'Rincian Belanja', name: 'rincian_belanja', widget: 'list', fields: [
                    { label: 'Pos', name: 'pos', widget: 'string' },
                    { label: 'Nominal (Rp)', name: 'nominal', widget: 'number' }
                  ]}
                ]
              },
              {
                name: 'stunting',
                label: 'Data Stunting',
                file: 'src/content/infografis/stunting.json',
                fields: [
                  { label: 'Tahun', name: 'tahun', widget: 'number' },
                  { label: 'Total Balita', name: 'total_balita', widget: 'number' },
                  { label: 'Terindikasi Stunting', name: 'terindikasi', widget: 'number' },
                  { label: 'Prevalensi (%)', name: 'prevalensi', widget: 'number', value_type: 'float' },
                  { label: 'Kategori', name: 'kategori', widget: 'list', fields: [
                    { label: 'Nama', name: 'nama', widget: 'string', hint: 'Contoh: Keluarga Sasaran, Berisiko, Baduta, Balita, PUS, PUS Hamil' },
                    { label: 'Jumlah', name: 'jumlah', widget: 'number' }
                  ]}
                ]
              },
              {
                name: 'bantuan',
                label: 'Data Bantuan Sosial',
                file: 'src/content/infografis/bantuan.json',
                fields: [
                  { label: 'Program Bantuan', name: 'program', widget: 'list', fields: [
                    { label: 'Nama Program', name: 'nama', widget: 'string', hint: 'Contoh: PKH, BLT, BPNT, PIP' },
                    { label: 'Deskripsi', name: 'deskripsi', widget: 'string' },
                    { label: 'Jumlah Penerima', name: 'jumlah_penerima', widget: 'number' },
                    { label: 'Satuan', name: 'satuan', widget: 'string', hint: 'Contoh: KPM, siswa' },
                    { label: 'Sumber', name: 'sumber', widget: 'string', hint: 'Contoh: Kemensos, Kemendikbud' }
                  ]}
                ]
              },
              {
                name: 'sdgs',
                label: 'Data SDGs Desa',
                file: 'src/content/infografis/sdgs.json',
                fields: [
                  { label: 'Skor SDGs Total', name: 'skor_total', widget: 'number', value_type: 'float' },
                  { label: 'Capaian per Tujuan', name: 'capaian', widget: 'list', fields: [
                    { label: 'Nomor SDGs', name: 'nomor', widget: 'number' },
                    { label: 'Nama Tujuan', name: 'nama', widget: 'string' },
                    { label: 'Persentase (%)', name: 'persentase', widget: 'number' }
                  ]}
                ]
              }
            ]
          }
        ]
      }
    });

    // Register preview styles to match site appearance
    CMS.registerPreviewStyle(`
      html {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
        color: #1f2937;
      }
      body {
        padding: 2rem;
        max-width: 768px;
        margin: 0 auto;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 0.5rem;
        border-bottom: 3px solid #16a34a;
        padding-bottom: 0.5rem;
      }
      h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1f2937;
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
      }
      h3 {
        font-size: 1.25rem;
        font-weight: 600;
        color: #374151;
        margin-top: 1.25rem;
        margin-bottom: 0.5rem;
      }
      p {
        margin-bottom: 1rem;
        color: #374151;
      }
      img {
        max-width: 100%;
        height: auto;
        border-radius: 0.5rem;
        margin: 1rem 0;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }
      a {
        color: #16a34a;
        text-decoration: underline;
      }
      ul, ol {
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }
      li {
        margin-bottom: 0.25rem;
      }
      blockquote {
        border-left: 4px solid #16a34a;
        padding-left: 1rem;
        margin: 1rem 0;
        color: #4b5563;
        font-style: italic;
        background: #f0fdf4;
        padding: 1rem;
        border-radius: 0 0.5rem 0.5rem 0;
      }
      code {
        background: #f3f4f6;
        padding: 0.2rem 0.4rem;
        border-radius: 0.25rem;
        font-size: 0.875em;
      }
      pre {
        background: #1f2937;
        color: #f9fafb;
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin: 1rem 0;
      }
      pre code {
        background: none;
        padding: 0;
        color: inherit;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1rem 0;
      }
      th, td {
        border: 1px solid #e5e7eb;
        padding: 0.5rem 0.75rem;
        text-align: left;
      }
      th {
        background: #f9fafb;
        font-weight: 600;
      }
      hr {
        border: none;
        border-top: 2px solid #e5e7eb;
        margin: 2rem 0;
      }
      /* Meta info styling */
      .frame-content > div:first-child {
        font-family: system-ui, sans-serif;
      }
    `, { raw: true });
  </script>
</body>
</html>
